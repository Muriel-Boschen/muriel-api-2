name: IMAGEM NO DOCKERHUB

on:
  push:
    branches:
      - main

jobs:
  testes-unitarios:
    runs-on: ubuntu-latest
    name: Testes Unitários

    steps:
      - name: Checkout código
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.11

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Rodar testes unitários
        run: |
          python -m unittest discover -s . -p "test_matematica.py"

  build-e-dockerhub:
    runs-on: ubuntu-latest
    name: Build e Push DockerHub
    needs: testes-unitarios

    steps:
      - name: Checkout código
        uses: actions/checkout@v3

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build da imagem Docker
        run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/muriel-app:latest .

      - name: Push para o Docker Hub
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/muriel-app:latest
